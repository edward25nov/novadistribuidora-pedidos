# API + MLflow con un solo comando:
#   docker compose up -d --build     # API: http://localhost:8000  · MLflow: http://localhost:5001
#   docker compose down              # detener (las trazas se conservan en el volumen)
#
# Requisitos: .env (copiado de .env.example, con una clave) y los datos del GES en ./ges
services:
  api:
    build: .
    image: novadistribuidora-api:latest
    env_file: .env
    environment:
      RUTA_DATOS: /datos                       # absoluta dentro del contenedor
      MLFLOW_TRACKING_URI: http://mlflow:5000  # red interna de compose
      MLFLOW_EXPERIMENTO: novadistribuidora-pedidos
    volumes:
      - ./ges:/datos:ro                        # datos del GES, solo lectura
    ports:
      - "8000:8000"
    depends_on:
      - mlflow          # sin "service_healthy": la API arranca aunque MLflow no esté
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "*"
    ports:
      - "5001:5000"     # en macOS el 5000 lo ocupa AirPlay
    volumes:
      - mlflow-datos:/mlflow
    restart: unless-stopped

volumes:
  mlflow-datos:
